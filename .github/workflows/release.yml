name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1)'
        required: true
        default: '0.0.0-dev'
      msix_release_tag:
        description: 'Only build and attach signed test MSIX to an existing beta release (e.g. v1.2.4-beta.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.msix_release_tag == ''
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff needs the full history and tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # tag "v1.0.1" -> "1.0.1"; manual runs use the input instead
      - name: Resolve version
        id: v
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file_version=${version%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test unlock envelopes
        run: dotnet run --project tests/VaultType.Hello.Tests -c Release

      # changelog for THIS release, from the conventional commits since the last tag
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish (self-contained, single file)
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dotnet publish src/VaultType/VaultType.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish
          # Ship the portable build as a ZIP so the license and third-party notices
          # (OFL/ISC/MIT attribution requirements) travel with the executable.
          Compress-Archive `
            -Path publish/VaultType.exe, LICENSE, THIRD-PARTY-NOTICES.md `
            -DestinationPath "VaultType-${env:VERSION}-win-x64.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
          FILE_VERSION: ${{ steps.v.outputs.file_version }}
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION /DMyFileVersion=$env:FILE_VERSION installer\VaultType.iss

      # keep the builds around even for manual/test runs that don't cut a release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultType-win-x64
          path: |
            VaultType-*.zip
            VaultType-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            VaultType-*.zip
            VaultType-*.exe
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.v.outputs.prerelease == 'true' && 'false' || 'legacy' }}

      # keep a CHANGELOG.md in the repo, refreshed on the default branch
      - name: Switch to default branch
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"

      - name: Regenerate CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet && { echo "changelog unchanged"; exit 0; }
          git commit -m "docs: update changelog for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD

  # Sideloadable beta package, built from the existing release tag rather than a moving branch.
  # The certificate's private key stays on the disposable runner; only the public .cer is shipped.
  beta-msix:
    if: github.event_name == 'workflow_dispatch' && inputs.msix_release_tag != ''
    runs-on: windows-latest
    steps:
      - name: Resolve beta source and package version
        id: beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.msix_release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)-beta\.([1-9]\d*)$') {
            throw 'Expected a beta tag such as v1.2.4-beta.1.'
          }
          $packageVersion = "$($Matches[1]).$($Matches[2])"
          foreach ($part in $packageVersion.Split('.')) {
            if ([long]$part -gt 65535) { throw 'MSIX version components must fit in 16 bits.' }
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.prerelease -or $release.draft) {
            throw 'The target must be an existing published pre-release.'
          }
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the beta source commit.' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.beta.outputs.source_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test unlock envelopes
        run: dotnet run --project tests/VaultType.Hello.Tests -c Release

      - name: Build and verify signed MSIX
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.beta.outputs.package_version }}
          RELEASE_TAG: ${{ inputs.msix_release_tag }}
        run: |
          pwsh packaging/msix/build-msix.ps1 -Version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed.' }
          $msix = 'packaging/msix/out/VaultType.msix'
          $cer = 'packaging/msix/out/VaultType-dev.cer'
          if (!(Test-Path $msix) -or !(Test-Path $cer)) { throw 'Missing package or certificate.' }

          # Trust the test signer on this disposable runner only, then verify the entire signature.
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$signtool) { throw 'signtool.exe is required to verify the package.' }
          & $signtool verify /pa /all /v $msix
          if ($LASTEXITCODE -ne 0) { throw 'MSIX signature verification failed.' }

          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $msix))
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
            try { $manifest = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($manifest.Package.Identity.Version -ne $env:PACKAGE_VERSION) {
              throw 'The MSIX manifest version does not match the requested beta.'
            }
            if (!$zip.GetEntry('VaultType.exe')) { throw 'The package is missing VaultType.exe.' }
          } finally { $zip.Dispose() }

          $version = $env:RELEASE_TAG.Substring(1)
          Copy-Item $msix "VaultType-$version-win-x64.msix"
          Copy-Item $cer "VaultType-$version-dev.cer"
          @"
          VaultType $version - sideloadable Windows x64 test MSIX
          Package version: $env:PACKAGE_VERSION
          Source commit: ${{ steps.beta.outputs.source_sha }}

          1. Close other running VaultType instances.
          2. In an administrator PowerShell, trust this beta's PUBLIC signing certificate:
             Import-Certificate -FilePath ".\VaultType-$version-dev.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          3. In PowerShell under your normal Windows account, install the package:
             Add-AppxPackage -Path ".\VaultType-$version-win-x64.msix"

          This is a self-signed test package, separate from the Microsoft Store edition.
          Windows 11 24H2 or later is required for the passkey provider.
          Native Windows Hello / TPM reboot acceptance still requires real-device testing.
          "@ | Set-Content "VaultType-$version-MSIX-install.txt"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultType-beta-msix
          path: |
            VaultType-*.msix
            VaultType-*-dev.cer
            VaultType-*-MSIX-install.txt

      - name: Attach MSIX to beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.msix_release_tag }}
        run: |
          $assets = Get-ChildItem 'VaultType-*.msix', 'VaultType-*-dev.cer', 'VaultType-*-MSIX-install.txt'
          gh release upload $env:RELEASE_TAG @($assets.FullName) --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach the MSIX release assets.' }

  # Submit the packaged (passkey-capable) edition to the Microsoft Store. Tag pushes only -
  # manual test runs must not create Store submissions. Certification takes 1-3 business days;
  # only one submission can be in flight at a time. A "[skip store]" in the tagged commit's
  # message skips the submission (for versions that were already submitted by hand).
  store:
    runs-on: windows-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.event.head_commit.message, '[skip store]')
    # never two of these at once (tags pushed back to back), and never cancel a running upload
    concurrency:
      group: store-submission
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Store identity is stamped by the script; the package stays unsigned (the Store signs it).
      - name: Build Store MSIX
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: pwsh packaging/msix/build-msix.ps1 -Store -Version "$env:VERSION.0"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultType-Store-msix
          path: packaging/msix/out/VaultType-Store.msix

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Reconfigure store credentials
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID `
            --clientSecret $env:CLIENT_SECRET

      - name: Publish to Store
        run: msstore publish packaging/msix/out/VaultType-Store.msix -id 9N5CLMW5XJ49
